android.useAndroidX=true
# 6g, not 3. lintVitalRelease — which runs on every store build and cannot be
# skipped from Studio — killed the daemon outright at 3g on this project
# ("Gradle build daemon disappeared unexpectedly"). That reads as a broken
# toolchain rather than as an out-of-memory, and it only happens on the RELEASE
# path, which is the worst moment to meet it.
org.gradle.jvmargs=-Xmx6g
org.gradle.caching=true
kotlin.code.style=official
