<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AiRspace UI — spatial widget prototype</title>
  <style>
    :root { --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* The canvas is absolutely positioned for letterboxing, and it is appended
       after #hud, so without an explicit stacking order it paints over the
       controls and swallows every click. */
    canvas { display: block; outline: 1px solid rgba(140,170,200,.18); z-index: 0; }
    body { background: #05070a; }

    #hud {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      font-family: var(--mono); color: #cfe; font-size: 12px;
    }
    #hud .row { position: absolute; display: flex; gap: 6px; pointer-events: auto; flex-wrap: wrap; }
    #themes { top: 14px; left: 14px; max-width: 62vw; }
    #modes  { top: 14px; right: 14px; }
    #read   { bottom: 14px; left: 14px; right: 14px; justify-content: space-between; align-items: flex-end; }

    button {
      font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
      background: rgba(8,12,18,.72); color: #8fa6b8;
      border: 1px solid rgba(140,170,200,.28); padding: 6px 10px;
      cursor: pointer; backdrop-filter: blur(6px);
    }
    button:hover { color: #fff; border-color: rgba(200,225,245,.6); }
    button[aria-pressed="true"] { background: var(--ac, #35E0F0); color: #04070a; border-color: var(--ac, #35E0F0); }
    button .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }

    .plate {
      background: rgba(8,12,18,.72); border: 1px solid rgba(140,170,200,.22);
      padding: 8px 11px; backdrop-filter: blur(6px); max-width: 46ch; line-height: 1.55;
    }
    .plate b { color: #fff; }
    .plate .k { color: #6c8296; }
    #reticle {
      z-index: 5;
      position: fixed; left: 50%; top: 50%; width: 5px; height: 5px;
      margin: -2.5px 0 0 -2.5px; border-radius: 50%;
      background: rgba(255,255,255,.75); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="row" id="themes"></div>
    <div class="row" id="modes">
      <button id="m-home" aria-pressed="true">HORIZON</button>
      <button id="m-console" aria-pressed="false">CONSOLE</button>
      <button id="m-hud" aria-pressed="true">HUD</button>
      <button id="m-sun" aria-pressed="false">SUNLIGHT</button>
      <button id="m-lang">EN</button>
    </div>
    <div class="row" id="read">
      <div class="plate" id="status"></div>
      <div class="plate" id="help">
        <span class="k">drag</span> look around &nbsp;
        <span class="k">hover + click</span> operate a widget &nbsp;
        <span class="k">drag a bead</span> scrub a RAIL
      </div>
    </div>
  </div>
  <div id="reticle"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
