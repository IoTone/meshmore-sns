{{ define "main" }}
<h1>{{ .Title }}</h1>
<p class="tagline">{{ .Description }}</p>
{{ .Content }}
{{ if .Site.Params.downloadUrl }}
<a class="cta" href="{{ .Site.Params.downloadUrl }}">{{ if eq .Site.Language.Lang "ja" }}ダウンロード{{ else }}Download{{ end }}</a>
{{ else }}
<span class="cta soon">{{ if eq .Site.Language.Lang "ja" }}近日公開{{ else }}Coming soon{{ end }}</span>
{{ end }}
{{ end }}
