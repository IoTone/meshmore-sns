plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// A release build must be signed with a key the publisher holds. The Flutter
// template signs release with `signingConfigs.debug`, which produces an APK
// signed by the public debug key: structurally uploadable, and rejected by
// Play on the first upload. The keystore and its passwords live outside the
// repo in `android/key.properties` (git-ignored; see key.properties.example).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.iotone.meshmore_sns_app"
    // API 36 is a store obligation (Play requires it for new uploads), so it
    // is pinned here rather than inherited from `flutter.compileSdkVersion`:
    // a Flutter downgrade would otherwise silently lower the target the app
    // is reviewed against. Verified from the built APK:
    //   aapt2 dump badging app-debug.apk | grep targetSdkVersion
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // `flutter_local_notifications` is built against java.time, which is
        // not in the API level the app supports. Its AAR metadata refuses the
        // build without desugaring, and that failure only appears at
        // `assembleDebug`, not in any test. Desugaring is the fix rather than a
        // minSdk bump, which would drop the devices this app still supports.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.iotone.meshmore_sns_app"
        // Pinned rather than inherited: `flutter.minSdkVersion` moves with the
        // Flutter release, so a toolchain bump would silently drop devices the
        // app still supports. 24 is what this build installs on (Android 7 and
        // up) because `flutter_local_notifications` needs java.time desugaring
        // anyway; raising it costs devices, lowering it is untested.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Without a keystore the release variant is left unsigned rather
            // than signed with the debug key: an unsigned artifact fails
            // loudly at upload, a debug-signed one fails later and worse.
            signingConfig hasReleaseKeystore ? signingConfigs.release : null
        }
    }
}

flutter {
    source '../..'
}

// Ask for a shippable release artifact without a keystore and the build stops
// here, naming the file it looked for. Only the tasks that produce or install
// a release build count: `compileReleaseKotlin`, `lintVitalRelease` and
// `testReleaseUnitTest` are ordinary work that needs no signing key, and a
// substring match used to refuse them.
gradle.taskGraph.whenReady { graph ->
    def ships = ['assembleRelease', 'bundleRelease', 'installRelease',
                 'packageRelease']
    def wantsRelease = graph.allTasks.any { task ->
        ships.any { task.name == it || task.name.startsWith(it) }
    }
    if (wantsRelease && !hasReleaseKeystore) {
        throw new GradleException(
            "Release signing needs android/key.properties with storeFile, " +
            "storePassword, keyAlias and keyPassword; copy " +
            "android/key.properties.example and fill it in. " +
            "Refusing to build a release signed with the debug key.")
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
