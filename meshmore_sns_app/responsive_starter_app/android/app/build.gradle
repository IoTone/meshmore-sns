plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.iotone.meshmore_sns_app"
    // API 36 is a store obligation (Play requires it for new uploads), so it
    // is pinned here rather than inherited from `flutter.compileSdkVersion`:
    // a Flutter downgrade would otherwise silently lower the target the app
    // is reviewed against. Verified from the built APK:
    //   aapt2 dump badging app-debug.apk | grep targetSdkVersion
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // `flutter_local_notifications` is built against java.time, which is
        // not in the API level the app supports. Its AAR metadata refuses the
        // build without desugaring, and that failure only appears at
        // `assembleDebug`, not in any test. Desugaring is the fix rather than a
        // minSdk bump, which would drop the devices this app still supports.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.iotone.meshmore_sns_app"
        // Meshmore requires BLE + modern permissions; minSdk 23 per spec.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
